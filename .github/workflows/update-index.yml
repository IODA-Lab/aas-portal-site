name: Update README index

on:
  push:
    branches: [main]
    paths:
      - "equipment/**"
      - "tools/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            README.md
            tools/archive-index/
          sparse-checkout-cone-mode: false
      - run: python3 tools/archive-index/build_index.py
      - run: python3 tools/archive-index/build_index.py --check || true
      - run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README index"
          git push
